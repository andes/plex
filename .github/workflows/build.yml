name: Build

on: [push]

permissions:
  contents: read

jobs:
  build:
    uses: andes/shared-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "18"
      cache: npm
      commands: |
        npm run lint
        npm run build
        npx ng build plex-demo --configuration development --progress=false
        test -s dist/plex-demo/index.html
